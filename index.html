<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Web SDK Integration</title>

    <!-- 1. Import CSS của Zoom SDK (Bắt buộc) -->
    <link type="text/css" rel="stylesheet" href="https://source.zoom.us/2.18.2/css/bootstrap.css" />
    <link type="text/css" rel="stylesheet" href="https://source.zoom.us/2.18.2/css/react-select.css" />

    <!-- Import Tailwind CSS để làm giao diện form nhập liệu đẹp hơn -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Tùy chỉnh một chút để form không bị vỡ do CSS của Zoom */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
        }
        
        /* Ẩn root của zoom khi chưa vào họp */
        #zmmtg-root {
            display: none; 
            background-color: black;
        }

        /* Container cho form nhập liệu */
        #lobby-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- PHẦN 1: GIAO DIỆN NHẬP THÔNG TIN (LOBBY) -->
    <div id="lobby-container">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md border border-gray-200">
            <div class="text-center mb-6">
                <img src="https://st2.zoom.us/static/6.3.10815/image/new/ZoomLogo.png" alt="Zoom Logo" class="h-10 mx-auto mb-2">
                <h2 class="text-2xl font-bold text-gray-800">Tham gia cuộc họp</h2>
                <p class="text-gray-500 text-sm">Web SDK Integration</p>
            </div>

            <form id="meeting-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tên hiển thị</label>
                    <input type="text" id="display_name" value="Học viên Demo" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Meeting ID</label>
                    <input type="text" id="meeting_number" placeholder="Ví dụ: 1234567890" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Passcode</label>
                    <input type="password" id="meeting_pwd" placeholder="Mật khẩu cuộc họp" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Vai trò (Role)</label>
                    <select id="meeting_role" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="0">Người tham gia (Attendee)</option>
                        <option value="1">Chủ trì (Host)</option>
                    </select>
                </div>

                <div class="pt-2">
                    <button type="submit" id="join-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-md transition duration-200 flex justify-center items-center">
                        <span>Vào học ngay</span>
                    </button>
                </div>
                
                <div id="status-msg" class="text-center text-sm text-red-500 mt-2 hidden"></div>
            </form>
        </div>
    </div>

    <!-- PHẦN 2: CONTAINER CỦA ZOOM (BẮT BUỘC PHẢI CÓ) -->
    <div id="zmmtg-root"></div>

    <!-- PHẦN 3: IMPORT THƯ VIỆN JS ZOOM -->
    <!-- Lưu ý: Thứ tự import rất quan trọng -->
    <script src="https://source.zoom.us/2.18.2/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/2.18.2/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/2.18.2/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/2.18.2/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/2.18.2/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/zoom-meeting-2.18.2.min.js"></script>

    <!-- PHẦN 4: LOGIC XỬ LÝ CHÍNH -->
    <script>
        // --- CẤU HÌNH ---
        const SIGNATURE_API = "https://script.google.com/macros/s/AKfycbwGgVNT6BnsibPpHGOgf0qtKwDtN6_Mrh4k6Q_YQnV_idtam1LsbhNdEpuRGXQXeKcsQg/exec";
        // Đã xóa ký tự ']' thừa ở cuối ID bạn cung cấp
        const CLIENT_ID = "HsT9JBboQO6Xuocxygk0w"; 

        // Hàm xử lý sự kiện submit form
        document.getElementById('meeting-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Lấy thông tin từ form
            const meetingConfig = {
                mn: document.getElementById('meeting_number').value.replace(/\s/g, ''), // Xóa khoảng trắng nếu có
                name: document.getElementById('display_name').value,
                pwd: document.getElementById('meeting_pwd').value,
                role: parseInt(document.getElementById('meeting_role').value, 10),
                email: "user@example.com", // Email giả định (Zoom Web SDK yêu cầu trường này)
                lang: "vi-VN"
            };

            if (!meetingConfig.mn) {
                showStatus("Vui lòng nhập Meeting ID", true);
                return;
            }

            // Bắt đầu quy trình
            initiateZoom(meetingConfig);
        });

        function showStatus(msg, isError = false) {
            const el = document.getElementById('status-msg');
            el.textContent = msg;
            el.className = isError ? "text-center text-sm text-red-500 mt-2 block" : "text-center text-sm text-blue-600 mt-2 block";
            el.classList.remove('hidden');
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('join-btn');
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Đang kết nối...`;
            } else {
                btn.disabled = false;
                btn.innerHTML = `<span>Vào học ngay</span>`;
            }
        }

        // --- HÀM KHỞI TẠO ZOOM ---
        function initiateZoom(config) {
            setLoading(true);
            showStatus("Đang lấy chữ ký bảo mật...", false);

            // 1. Cấu hình SDK cơ bản
            ZoomMtg.setZoomJLib('https://source.zoom.us/2.18.2/lib', '/av');
            ZoomMtg.preLoadWasm();
            ZoomMtg.prepareWebSDK();
            
            // Cài đặt ngôn ngữ hiển thị (tuỳ chọn)
            ZoomMtg.i18n.load('vi-VN');
            ZoomMtg.i18n.reload('vi-VN');

            // 2. Gọi API lấy chữ ký
            // Lưu ý: Google Apps Script có thể trả về Redirect 302, fetch mặc định sẽ follow redirect.
            fetch(`${SIGNATURE_API}?mn=${config.mn}&role=${config.role}`)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    console.log("Response từ Signature API:", data);
                    
                    if (data.signature) {
                        showStatus("Đã có chữ ký. Đang vào phòng...", false);
                        startMeeting(data.signature, config);
                    } else {
                        throw new Error("Không tìm thấy signature trong phản hồi API");
                    }
                })
                .catch(error => {
                    console.error("Lỗi lấy chữ ký:", error);
                    showStatus("Lỗi kết nối Server hoặc Meeting ID sai. Vui lòng thử lại.", true);
                    setLoading(false);
                });
        }

        // --- HÀM JOIN MEETING ---
        function startMeeting(signature, config) {
            // Ẩn giao diện Lobby, hiện giao diện Zoom
            document.getElementById('lobby-container').style.display = 'none';
            document.getElementById('zmmtg-root').style.display = 'block';

            ZoomMtg.init({
                leaveUrl: window.location.href, // Thoát họp thì load lại trang
                success: (success) => {
                    console.log("Zoom Init thành công");
                    ZoomMtg.join({
                        signature: signature,
                        meetingNumber: config.mn,
                        userName: config.name,
                        apiKey: CLIENT_ID,
                        userEmail: config.email,
                        passWord: config.pwd,
                        success: (success) => {
                            console.log("Join thành công!", success);
                        },
                        error: (error) => {
                            console.log("Lỗi Join:", error);
                            alert("Không thể vào phòng: " + error.result);
                            // Nếu lỗi, reload lại trang để reset
                            window.location.reload();
                        }
                    });
                },
                error: (error) => {
                    console.log("Lỗi Init:", error);
                    alert("Lỗi khởi tạo Zoom SDK");
                }
            });
        }
    </script>
</body>
</html>
